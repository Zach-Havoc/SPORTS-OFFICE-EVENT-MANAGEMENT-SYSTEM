# Selenium end-to-end tests, run automatically on GitHub.
#
# Builds a throwaway SportAxis (MySQL service + Laravel API + built website),
# fills it with demo data and drives Chrome through every page of every role.
# Mail only goes to the log and nothing touches the deployed site.
# The steps are the same ones `npm run test:e2e:auto` runs on a laptop
# (SportAxisWeb/e2e/selenium/run.sh). Screenshots of failures are attached
# to the run as an artifact.
name: E2E (Selenium)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium:
    name: Selenium suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sportaxis_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: SportAxisWeb/backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('SportAxisWeb/backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install API dependencies
        working-directory: SportAxisWeb/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SportAxisWeb/package-lock.json

      - name: Install website dependencies
        working-directory: SportAxisWeb
        run: npm ci

      - name: Run the Selenium suite
        working-directory: SportAxisWeb
        run: npm run test:e2e:auto

      - name: Keep failure screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            SportAxisWeb/e2e/selenium/artifacts/
            SportAxisWeb/backend/storage/logs/
          retention-days: 7
