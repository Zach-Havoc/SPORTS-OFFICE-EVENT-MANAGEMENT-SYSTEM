# Render Blueprint — the SportsAxis Laravel API as a Docker web service.
# Walkthrough: RENDER_DEPLOYMENT.md. Values marked `sync: false` are asked for
# in the Render dashboard the first time the Blueprint is applied.
services:
  - type: web
    name: sportsaxis-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: SportAxisWeb/backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    buildFilter:
      paths:
        - SportAxisWeb/backend/**
    envVars:
      - key: APP_NAME
        value: SportsAxis
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false            # php artisan key:generate --show
      - key: APP_URL
        sync: false            # https://sportsaxis-api.onrender.com
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://sportsaxis-bsuarasof.freedev.app,http://localhost:5173

      # Database — an external MySQL (Render has no MySQL). See the guide.
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false            # the provider's CA certificate, pasted as text

      # No worker, websockets or cron on the free plan.
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: log
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database

      # Uploads: the free plan's disk is wiped on every restart, so keep them
      # in an S3-compatible bucket. Leave PUBLIC_DISK_DRIVER=local to skip.
      - key: PUBLIC_DISK_DRIVER
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # Mail (password reset, verification) and the OCR service.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: SportsAxis
      - key: OCR_SERVICE_URL
        sync: false
      - key: OCR_API_KEY
        sync: false
      - key: MIGRATION_TOKEN     # for /artisan-migrate (seeding, resets)
        sync: false
